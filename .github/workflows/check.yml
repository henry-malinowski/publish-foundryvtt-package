# Merge gate: runs `make check` (shellcheck + test suite) on:
# - PRs
# - pushes to main
# - and v* tags

name: Check

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check
        run: make check
