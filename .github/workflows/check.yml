# Merge gate: runs `make check` (shellcheck + format-check + test suite) on:
# - PRs
# - pushes to main
# - and v* tags

name: Check

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  push:
    branches:
      - main
    tags:
      - "v*"
    # docs-only pushes to main skip the gate; v* tag pushes have no prior ref to
    # diff against, so GitHub can't filter them and the release gate still runs.
    paths-ignore:
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shfmt

      - name: Check
        run: make check
