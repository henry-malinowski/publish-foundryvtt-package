# Inline shellcheck annotations for same-repo PRs. Posts findings as PR
# review comments and fails the build on any finding (`fail_level: any`).
#
# Skipped on fork PRs: reviewdog requires a write-scoped token to post review
# comments, which GITHUB_TOKEN does not carry on fork pull_request events.
# Fork contributors still get shellcheck coverage from check.yml's logs.
#
# Duplicates check.yml's shellcheck pass intentionally: check.yml is the
# merge-blocking status check; this one annotates the diff inline.

name: ShellCheck Review

on:
  pull_request:
    paths-ignore:
      - "docs/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  shellcheck-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          reporter: github-pr-review
          fail_level: any
          path: "."
          pattern: "*.sh"
          check_all_files_with_shebangs: "true"
          shellcheck_flags: "--external-sources --shell=bash"
